name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyserial pyinstaller Pillow

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Configurador_Sondas_Aviot" --icon=aviot.ico --add-data "logo_aviot.png;." sondas_modbus.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Configurador_Sondas_Aviot
          path: dist/Configurador_Sondas_Aviot.exe
